spring.application.name=ImportEase

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

brevo.api.key=${BREVO_API_KEY:}
brevo.sms.sender=ImportEase
brevo.email.sender.name=ImportEase
brevo.email.sender.email=noreply@importease.com

paystack.secret.key=${PAYSTACK_SECRET_KEY:}
paystack.base.url=https://api.paystack.co

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB